[tool.poetry]
name = "focusgate-core"
version = "0.2.0"
description = "FocusGate core: reads Slack, writes a morning executive brief"
authors = ["Enzi Studio"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
python-dotenv = "^1.0.1"
fastapi = "^0.115.7"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
python-multipart = "^0.0.20"
pyngrok = "^7.2.3"
pytz = "^2024.2"
mailtrap = "^2.0.1"
supabase = "^2.12.0"
tenacity = "^9.0.0"
apscheduler = "^3.11.0"
jinja2 = "^3.1.5"
inflect = "^7.5.0"
google-generativeai = "^0.8.4"
sentry-sdk = {extras = ["fastapi"], version = "^2.20.0"}
fauna = "^2.4.0"
loguru = "^0.7.3"
celery = {extras = ["redis"], version = "^5.4.0"}
pytest = "^8.3.4"
pytest-asyncio = "^0.25.3"
clerk-backend-api = "^1.7.2"
sqlalchemy = "^2.0.38"
psycopg2-binary = "^2.9.10"
pydantic = "^2.10.6"
uuid = "^1.30"
pydantic-settings = "^2.7.1"
openai = "^1.63.2"
slack-sdk = "^3.34.0"
beautifulsoup4 = "^4.13.3"
aiohttp = "^3.11"


[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
isort = "^6.0.0"
pre-commit = "^4.1.0"

[tool.isort]
profile = "black"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"