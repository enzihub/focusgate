services:
  web:
    build: .
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL}
      - API_KEY=${API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET}
      - HOST=0.0.0.0
      - CELERY_BROKER_URL=${REDIS_URL:-redis://redis:6379}
      - CELERY_RESULT_BACKEND=${REDIS_URL:-redis://redis:6379}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

  celery_worker:
    build: .
    command: celery -A app.core.scheduler.job_tasks worker --loglevel=info
    depends_on:
      - redis
    environment:
      - CELERY_BROKER_URL=${REDIS_URL:-redis://redis:6379}
      - CELERY_RESULT_BACKEND=${REDIS_URL:-redis://redis:6379}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}

  celery_beat:
    build: .
    command: celery -A app.core.scheduler.job_tasks beat --loglevel=info
    depends_on:
      - redis
    environment:
      - CELERY_BROKER_URL=${REDIS_URL:-redis://redis:6379}
      - CELERY_RESULT_BACKEND=${REDIS_URL:-redis://redis:6379}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}

  redis:
    image: redis:alpine
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 3

volumes:
  redis-data: