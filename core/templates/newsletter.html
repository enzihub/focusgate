<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <style>
        body {
            font-family: Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 15px;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            line-height: 22px;
            color: #000000;
        }
        .main-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
        }
        .meta-header {
            padding: 11px 20px;
            text-align: right;
            font-size: 12px;
            color: #999999;
        }
        .header {
            text-align: center;
            padding: 20px;
            border-bottom: 2px solid #000000;
        }
        .logo {
            width: 256px;
            height: auto;
            margin-bottom: 20px;
        }
        .header h1 {
            font-family: Georgia, Times, "Times New Roman", serif;
            font-size: 32px;
            margin: 0;
            font-weight: normal;
            color: #000000;
        }
        .header p {
            color: #666666;
            margin: 10px 0 0;
            font-size: 14px;
        }
        .intro-text {
            margin: 20px 0;
            line-height: 1.6;
        }
        .share-section {
            margin: 20px 0;
            color: #666666;
        }
        .share-section a {
            color: #0066cc;
            text-decoration: underline;
        }
        .section-title {
            font-family: Georgia, Times, "Times New Roman", serif;
            font-size: 23px;
            line-height: 32px;
            padding: 2px 8px;
            display: inline-block;
            margin: 20px 0 10px 20px;
        }
        .yellow-bg {
            background-color: #efef6f;
        }
        .divider {
            border-top: 2px solid #000000;
            margin: 10px 20px;
        }
        .content-section {
            padding: 0 20px 20px;
        }
        .summary-content {
            margin-bottom: 30px;
            padding-bottom: 20px;
        }
        .footer {
            background-color: #000000;
            color: #ffffff;
            padding: 30px 20px;
            text-align: center;
        }
        .footer-info {
            background-color: #ffffff;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
        }
        .unsubscribe {
            color: #666666;
            font-size: 10px;
            margin-top: 10px;
        }
        a {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="header">
            {% if logo_data %}
            <img src="{{ logo_data }}" alt="FocusGate" class="logo">
            {% endif %}
            <h1>{{ title }}</h1>
            <p>{{ timestamp }}</p>
        </div>

        <div class="content-section">
            <div class="intro-text">
                <p><b>Good {{ day_of_week }}!</b> It's {{ date }}. Here's your executive summary for today.</p>
            </div>
        </div>

        <div class="section-title yellow-bg">Executive Summary</div>
        <div class="divider"></div>
        <div class="content-section">
            <div class="summary-content">
                {{ summary | safe }}
            </div>
        </div>

        <div class="footer-info">

            {% if app_url %}
            <div class="unsubscribe">
                <p>Want to unsubscribe? <a href="{{ app_url }}/profile">Manage your preferences here</a></p>
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
